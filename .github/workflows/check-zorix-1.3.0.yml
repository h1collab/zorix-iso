name: Zorix OS 1.3.0 Source Checks

on:
  push:
    paths:
      - '.github/workflows/check-zorix-1.3.0.yml'
      - 'release/1.3.0/**'
  pull_request:
    paths:
      - '.github/workflows/check-zorix-1.3.0.yml'
      - 'release/1.3.0/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: check-zorix-1.3.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libx11-dev python3-yaml
      - name: Validate installer configuration
        run: python3 release/1.3.0/tools/validate_installer_config.py
      - name: Compile portable framebuffer bridge
        run: |
          gcc -O2 -Wall -Wextra -Werror             release/1.3.0/src/framebuffer_bridge.c -lX11 -o /tmp/zorix-framebuffer
          /tmp/zorix-framebuffer --help >/dev/null 2>&1 || test "$?" = 64
      - name: Validate shell sources
        run: |
          sh -n release/1.3.0/src/zorix-installer
          sh -n release/1.3.0/src/zorix-storage-rescan
          sh -n release/1.3.0/src/zorix-session-supervisor.sh
          sh -n release/1.3.0/runtime/live-boot.sh
          sh -n release/1.3.0/runtime/glass-session.sh
          python3 -m py_compile release/1.3.0/runtime/glass_server.py
          node --check release/1.3.0/ui/app.js
          grep -Fq 'ahci ata_piix nvme' release/1.3.0/runtime/live-boot.sh
          grep -Fq -- '--autostart' release/1.3.0/runtime/glass-session.sh
          grep -Fq 'udiskie --automount' release/1.3.0/runtime/glass-session.sh
          grep -Fq 'Driver "libinput"' release/1.3.0/xorg/40-zorix-libinput.conf
          grep -Fq 'Option "Tapping" "on"' release/1.3.0/xorg/40-zorix-libinput.conf
          ! grep -Fq 'Option "ClickMethod" "clickfinger"' release/1.3.0/xorg/40-zorix-libinput.conf
          grep -Fq 'ZORIX_PARTED_DISKS' release/1.3.0/runtime/live-boot.sh
          grep -Fq 'exit 75' release/1.3.0/src/zorix-installer
          grep -Fq 'attempt=1' release/1.3.0/runtime/glass-session.sh
          grep -Fq 'zorix-glass-ready' release/1.3.0/runtime/glass-session.sh
          grep -Fq 'ZORIX_GLASS_READY' release/1.3.0/runtime/glass_server.py
          grep -Fq -- "'--disable-gpu'," release/1.3.0/runtime/glass_server.py
          grep -Fq -- "'--disable-features=Vulkan,UseSkiaRenderer,Dawn,WebGPU,CanvasOopRasterization'," release/1.3.0/runtime/glass_server.py
          grep -Fq 'ZORIX_GLASS_HEARTBEAT' release/1.3.0/runtime/glass_server.py
          ! grep -Fq -- '--disable-gpu-compositing' release/1.3.0/runtime/glass_server.py
          ! grep -Fq -- '--no-zygote' release/1.3.0/runtime/glass_server.py
          ! grep -Fq -- '--single-process' release/1.3.0/runtime/glass_server.py
          grep -Fq '/usr/lib/chromium/chromium' release/1.3.0/runtime/glass_server.py
          grep -Fq 'xserver-xorg-input-wacom' release/1.3.0/tools/build-candidate.sh
          grep -Fq '/api/volumes' release/1.3.0/runtime/glass_server.py
      - name: Validate Glass performance override
        run: |
          grep -Fq 'html[data-render="portable"] .liquid-glass' release/1.3.0/src/glass-1.3.css
          grep -Fq 'backdrop-filter:none!important' release/1.3.0/src/glass-1.3.css
          grep -Fq 'fps must be between 10 and 30' release/1.3.0/src/framebuffer_bridge.c
