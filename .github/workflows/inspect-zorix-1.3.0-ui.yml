name: Inspect Zorix 1.3.0 Glass Sources

on:
  push:
    paths:
      - '.github/workflows/inspect-zorix-1.3.0-ui.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: inspect-zorix-1.3.0-ui
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mtools p7zip-full zstd cpio curl
      - name: Download and verify current ISO
        run: |
          set -euxo pipefail
          BASE_URL=https://github.com/h1collab/zorix-iso/releases/download/v1.3.0
          curl -fL --retry 5 -o current.iso "$BASE_URL/ZorixOS-1.3.0-Glass-Installer.iso"
          curl -fL --retry 5 -o current.iso.sha256 "$BASE_URL/ZorixOS-1.3.0-Glass-Installer.iso.sha256"
          expected="$(awk 'NF {print $1; exit}' current.iso.sha256)"
          printf '%s  current.iso\n' "$expected" | sha256sum -c -
      - name: Extract Glass source snapshot
        run: |
          set -euxo pipefail
          rm -rf inspect work
          mkdir -p inspect work/rootfs
          7z e -y current.iso EFI.IMG -owork >/dev/null
          mcopy -i work/EFI.IMG ::ZORIX/LIVE.CPI work/LIVE.CPI
          sudo bash -c 'cd work/rootfs && zstd -dc ../LIVE.CPI | cpio -idm --no-absolute-filenames >/dev/null 2>&1'
          sudo chown -R "$(id -u):$(id -g)" work/rootfs
          mkdir -p inspect/glass inspect/runtime
          cp -a work/rootfs/usr/share/zorix/glass/. inspect/glass/
          for f in glass_server.py glass-session.sh live-boot.sh; do
            if [ -f "work/rootfs/usr/lib/zorix/$f" ]; then
              cp "work/rootfs/usr/lib/zorix/$f" "inspect/runtime/$f"
            fi
          done
          find inspect -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: zorix-1.3.0-glass-source-snapshot
          path: inspect
          retention-days: 7
