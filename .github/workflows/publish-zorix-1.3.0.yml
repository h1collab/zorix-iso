name: Publish Zorix OS 1.3.0 Installer

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-zorix-1.3.0
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build, validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release/1.3.0/tools/publish.sh
