name: Zorix Kernel Native Boot

on:
  push:
    paths:
      - 'kernel/zorix-kernel/**'
      - 'sdk/**'
      - 'tools/build-native-rootfs.py'
      - '.github/workflows/zorix-kernel-native.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: zorix-kernel-native-v04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld qemu-system-x86 ovmf dosfstools mtools socat imagemagick xorriso

      - name: Build independent Zorix Kernel EFI image
        run: |
          set -euxo pipefail
          mkdir -p out
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -fshort-wchar -mno-red-zone             -fno-stack-protector -fno-builtin -O2 -Wall -Wextra -Werror             -c kernel/zorix-kernel/src/kernel.c -o out/kernel.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -mno-red-zone -c             kernel/zorix-kernel/src/ports.S -o out/ports.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -mno-red-zone -c             kernel/zorix-kernel/src/user.S -o out/user.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -mno-red-zone -c             kernel/zorix-kernel/src/apps.S -o out/apps.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -fno-stack-protector -fno-builtin -O2 -Wall -Wextra -Werror             -c kernel/zorix-kernel/src/runtime.c -o out/runtime.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -fno-stack-protector -fno-builtin -O2 -Wall -Wextra -Werror             -c kernel/zorix-kernel/src/linux_abi.c -o out/linux_abi.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -fno-stack-protector -fno-builtin -O2 -Wall -Wextra -Werror             -c kernel/zorix-kernel/src/installer.c -o out/installer.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -fno-stack-protector -fno-builtin -O2 -Wall -Wextra -Werror             -c kernel/zorix-kernel/src/driver_core.c -o out/driver_core.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -fno-stack-protector -fno-builtin -O2 -Wall -Wextra -Werror             -c kernel/zorix-kernel/src/zorixfs.c -o out/zorixfs.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -fno-stack-protector -fno-builtin -O2 -Wall -Wextra -Werror             -c kernel/zorix-kernel/src/net_stack.c -o out/net_stack.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -fno-stack-protector -fno-builtin -O2 -Wall -Wextra -Werror             -c kernel/zorix-kernel/src/audio.c -o out/audio.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -fno-stack-protector -fno-builtin -O2 -Wall -Wextra -Werror             -c kernel/zorix-kernel/src/wireless.c -o out/wireless.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -fno-stack-protector -fno-builtin -O2 -Wall -Wextra -Werror             -c kernel/zorix-kernel/src/glass_render.c -o out/glass_render.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -fno-stack-protector -fno-builtin -O2 -Wall -Wextra -Werror             -c kernel/zorix-kernel/src/ui_font.c -o out/ui_font.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -fno-stack-protector -fno-builtin -O2 -Wall -Wextra -Werror             -c kernel/zorix-kernel/src/rootfs.c -o out/rootfs.obj
          clang --target=x86_64-pc-windows-msvc             -ffreestanding -mno-red-zone -fno-stack-protector -fno-builtin -O2 -Wall -Wextra -Werror             -I sdk/include -c sdk/examples/hello.c -o out/sdk-hello.obj
          test -s out/sdk-hello.obj
          echo 'ZORIX_SDK:example-build-ok'
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64             /out:out/ZORIXKERNEL.EFI out/kernel.obj out/ports.obj out/user.obj out/apps.obj out/runtime.obj out/linux_abi.obj out/installer.obj out/driver_core.obj out/zorixfs.obj out/net_stack.obj out/audio.obj out/wireless.obj out/glass_render.obj out/ui_font.obj out/rootfs.obj
          test -s out/ZORIXKERNEL.EFI
          sha256sum out/ZORIXKERNEL.EFI

      - name: Build native Zorix root filesystem
        run: |
          set -euxo pipefail
          python3 tools/build-native-rootfs.py --repo . --stage out/rootfs-stage --out out/rootfs.zpk
          test -s out/rootfs.zpk
          sha256sum out/rootfs.zpk
          rootfs_bytes="$(stat -c '%s' out/rootfs.zpk)"
          echo "Zorix native rootfs bytes: $rootfs_bytes"
          test "$rootfs_bytes" -ge 70000000

      - name: Create EFI system disk
        run: |
          set -euxo pipefail
          truncate -s 128M out/esp.img
          mkfs.vfat out/esp.img
          mmd -i out/esp.img ::EFI
          mmd -i out/esp.img ::EFI/BOOT
          mcopy -i out/esp.img out/ZORIXKERNEL.EFI ::EFI/BOOT/BOOTX64.EFI
          mmd -i out/esp.img ::System
          mcopy -i out/esp.img out/rootfs.zpk ::System/rootfs.zpk

      - name: Build bootable native Zorix ISO
        run: |
          set -euxo pipefail
          mkdir -p out/iso-root
          cp out/esp.img out/iso-root/esp.img
          mkdir -p out/iso-root/SDK
          cp -r sdk/include out/iso-root/SDK/include
          cp -r sdk/examples out/iso-root/SDK/examples
          cp sdk/README.md out/iso-root/SDK/README.md
          xorriso -as mkisofs -R -J -V ZORIX_NATIVE_07 \
            -eltorito-alt-boot -e esp.img -no-emul-boot \
            -o out/ZorixOS-Native-0.7.iso out/iso-root
          test -s out/ZorixOS-Native-0.7.iso
          sha256sum out/ZorixOS-Native-0.7.iso


      - name: Boot Zorix Kernel in QEMU OVMF
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
            VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
          else
            CODE=/usr/share/OVMF/OVMF_CODE.fd
            VARS=/usr/share/OVMF/OVMF_VARS.fd
          fi
          cp "$VARS" out/OVMF_VARS.fd
          truncate -s 64M out/nvme.img
          : > out/kernel-serial.log

          timeout --signal=TERM --kill-after=3s 40s             qemu-system-x86_64               -machine q35,accel=tcg               -cpu max -smp 2 -m 512               -drive if=pflash,format=raw,readonly=on,file="$CODE"               -drive if=pflash,format=raw,file=out/OVMF_VARS.fd               -cdrom out/ZorixOS-Native-0.7.iso               -boot d               -drive if=none,format=raw,file=out/nvme.img,id=nvme0               -device nvme,drive=nvme0,serial=ZORIXNVME               -device qemu-xhci,id=xhci               -device ich9-intel-hda               -device hda-duplex               -netdev user,id=net0               -device virtio-net-pci,netdev=net0               -display none               -serial file:out/kernel-serial.log               -monitor unix:/tmp/zorix-kernel-monitor.sock,server,nowait               -qmp unix:/tmp/zorix-kernel-qmp.sock,server,nowait               -no-reboot -no-shutdown &
          pid=$!

          # Capture real framebuffer frames while each native application is visible.
          (
            capture_marker() {
              marker="$1"
              file="$2"
              for n in $(seq 1 400); do
                if grep -Fq "$marker" out/kernel-serial.log; then
                  printf 'screendump %s\n' "$file" | socat - UNIX-CONNECT:/tmp/zorix-kernel-monitor.sock >/dev/null 2>&1 || true
                  exit 0
                fi
                sleep 0.05
              done
              exit 1
            }
            capture_marker 'ZORIX_APP_SETTINGS:ui-rendered' 'out/settings.ppm'
          ) &
          (
            capture_marker() {
              marker="$1"
              file="$2"
              for n in $(seq 1 400); do
                if grep -Fq "$marker" out/kernel-serial.log; then
                  printf 'screendump %s\n' "$file" | socat - UNIX-CONNECT:/tmp/zorix-kernel-monitor.sock >/dev/null 2>&1 || true
                  exit 0
                fi
                sleep 0.05
              done
              exit 1
            }
            capture_marker 'ZORIX_APP_BROWSER:ui-rendered' 'out/browser.ppm'
          ) &
          (
            capture_marker() {
              marker="$1"
              file="$2"
              for n in $(seq 1 400); do
                if grep -Fq "$marker" out/kernel-serial.log; then
                  printf 'screendump %s\n' "$file" | socat - UNIX-CONNECT:/tmp/zorix-kernel-monitor.sock >/dev/null 2>&1 || true
                  exit 0
                fi
                sleep 0.05
              done
              exit 1
            }
            capture_marker 'ZORIX_APP_STORE:ui-rendered' 'out/store.ppm'
          ) &

          # Drive the native Glass pointer pipeline with a real QEMU PS/2 event.
          (
            for n in $(seq 1 150); do
              if grep -Fq 'ZORIX_GLASS_NATIVE:userspace-render-ready' out/kernel-serial.log; then
                {
                  printf '%s\n' '{"execute":"qmp_capabilities"}'
                  printf '%s\n' '{"execute":"input-send-event","arguments":{"events":[{"type":"rel","data":{"axis":"x","value":-300}},{"type":"rel","data":{"axis":"y","value":-250}}]}}'
                  printf '%s\n' '{"execute":"input-send-event","arguments":{"events":[{"type":"btn","data":{"down":true,"button":"left"}}]}}'
                  sleep 0.15
                  printf '%s\n' '{"execute":"input-send-event","arguments":{"events":[{"type":"rel","data":{"axis":"x","value":120}},{"type":"rel","data":{"axis":"y","value":70}}]}}'
                  sleep 0.15
                  printf '%s\n' '{"execute":"input-send-event","arguments":{"events":[{"type":"btn","data":{"down":false,"button":"left"}}]}}'
                } | socat - UNIX-CONNECT:/tmp/zorix-kernel-qmp.sock > out/qmp-input.log 2>&1 || true
                printf 'sendkey a\n' | socat - UNIX-CONNECT:/tmp/zorix-kernel-monitor.sock > out/hmp-key.log 2>&1 || true
                exit 0
              fi
              sleep 0.1
            done
          ) &

          for second in $(seq 1 30); do
            if grep -Fq 'ZORIX_KERNEL_STATUS:desktop-foundation-running' out/kernel-serial.log; then
              grep -Fq 'ZORIX_KERNEL_STAGE:boot-services-exited' out/kernel-serial.log
              grep -Fq 'ZORIX_ROOTFS:mounted:files=' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_MEMORY:heap-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_IDT:breakpoint-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_PAGING:cr3=' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_TIMER:tick_hz=1000:irq0-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_STAGE:timer-ready' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_STAGE:pci-ready' out/kernel-serial.log
              grep -Fq 'ZORIX_DRIVER_AHCI:pci-bind-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_DRIVER_NVME:pci-bind-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_DRIVER_XHCI:pci-bind-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_DRIVER_NET:pci-bind-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_DRIVER_AUDIO:pci-bind-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_SCHED:fair-queue-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_SYSCALL:native-abi-dispatch-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_ELF:elf64-validate-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_VFS:metadata-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_PIPE:ring-buffer-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_FUTEX:wait-wake-state-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_RUNTIME_RAMFS:read-write-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_RUNTIME_ELF:program-loader-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_RUNTIME_ELF:segment-load-bss-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_RUNTIME_PROCESS:multi-app-table-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_APP_SETTINGS:ring3-ready' out/kernel-serial.log
              grep -Fq 'ZORIX_APP_SETTINGS:ui-rendered' out/kernel-serial.log
              grep -Fq 'ZORIX_APP_FILES:ring3-ready' out/kernel-serial.log
              grep -Fq 'ZORIX_APP_FILES:ui-rendered' out/kernel-serial.log
              grep -Fq 'ZORIX_APP_BROWSER:ring3-ready' out/kernel-serial.log
              grep -Fq 'ZORIX_APP_BROWSER:ui-rendered' out/kernel-serial.log
              grep -Fq 'ZORIX_APP_STORE:ring3-ready' out/kernel-serial.log
              grep -Fq 'ZORIX_APP_STORE:ui-rendered' out/kernel-serial.log
              grep -Fq 'ZORIX_RUNTIME_PROCESS:multi-ring3-launch-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_RUNTIME_DRIVERS:registry-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_LINUX_ABI:syscall-subset-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_INSTALLER_GPT:plan-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_INSTALLER_UEFI:esp-root-layout-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_DRIVER_AHCI:command-path-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_DRIVER_NVME:command-path-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_DRIVER_XHCI:command-path-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_DRIVER_AUDIO:verb-path-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_DRIVER_NET:tx-frame-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_DRIVER_WIFI:frame-path-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_DRIVER_BLUETOOTH:hci-path-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_FS:format-mount-read-write-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_NET:arp-ipv4-udp-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_AUDIO:48khz-mixer-ring-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_WIFI:80211-parser-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_BLUETOOTH:hci-state-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_STAGE:userspace-foundation-ready' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_GDT:tss-ring3-ready' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_PAGING:user-pages-enabled' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_USER:enter-cpl3' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_USER:cpl3-syscall-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_USER:returned-to-kernel' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_USER:ring3-execution-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_GLASS_NATIVE:userspace-render-ready' out/kernel-serial.log
              grep -Fq 'ZORIX_GLASS_RENDER:liquid-glass-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_GLASS_INPUT:focus-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_GLASS_INPUT:window-drag-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_GLASS_INPUT:keyboard-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_RENDER:target_hz=144:scheduled=' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_RENDER:144hz-cadence-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_RENDER:dirty-rect-present-ok' out/kernel-serial.log
              grep -Fq 'ZORIX_KERNEL_STAGE:compositor-ready' out/kernel-serial.log
              printf 'screendump out/zorix-kernel-0.4.ppm\n' | socat - UNIX-CONNECT:/tmp/zorix-kernel-monitor.sock
              test -s out/zorix-kernel-0.4.ppm
              magick out/zorix-kernel-0.4.ppm out/zorix-kernel-0.4.png 2>/dev/null || convert out/zorix-kernel-0.4.ppm out/zorix-kernel-0.4.png
              for shot in settings browser store; do
                test -s "out/$shot.ppm"
                magick "out/$shot.ppm" "out/$shot.png" 2>/dev/null || convert "out/$shot.ppm" "out/$shot.png"
                test -s "out/$shot.png"
              done
              colors="$(identify -format '%k' out/zorix-kernel-0.4.png)"
              echo "Zorix Kernel framebuffer unique colors: $colors"
              test "$colors" -ge 128
              cat out/kernel-serial.log
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              exit 0
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done

          cat out/kernel-serial.log >&2
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo 'Zorix Kernel did not reach kernel_main.' >&2
          exit 1

      - name: Publish verified native ISO release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag="native-v0.7.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/ZorixOS-Native-0.7.iso --clobber
          else
            gh release create "$tag" out/ZorixOS-Native-0.7.iso \
              --target "$GITHUB_SHA" \
              --title "Zorix Native 0.7" \
              --prerelease \
              --notes "Verified native Zorix Kernel 0.7 ISO with mounted native rootfs. Boots directly via UEFI/OVMF and includes the Zorix SDK."
          fi

      - name: Upload kernel prototype
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zorix-kernel-native
          path: |
            out/ZORIXKERNEL.EFI
            out/ZorixOS-Native-0.7.iso
            out/rootfs.zpk
            out/sdk-hello.obj
            out/kernel-serial.log
            out/qmp-input.log
            out/hmp-key.log
            out/zorix-kernel-0.4.png
            out/settings.png
            out/browser.png
            out/store.png
            sdk/README.md
            sdk/include/zorix/zorix.h
            sdk/examples/hello.c
          if-no-files-found: warn
          retention-days: 14
