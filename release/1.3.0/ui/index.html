<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zorix Glass 1.3</title>
<script src="boot.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wallpaper" aria-hidden="true">
  <div class="aurora aurora-a"></div>
  <div class="aurora aurora-b"></div>
  <div class="aurora aurora-c"></div>
  <div class="liquid-ribbon ribbon-a"></div>
  <div class="liquid-ribbon ribbon-b"></div>
  <div class="caustics"></div>
  <div class="grain"></div>
</div>
<div id="pointer-lens" aria-hidden="true"></div>

<header class="menubar liquid-glass">
  <div class="menu-left">
    <button class="brand" data-panel="about" aria-label="Zorix menu"><span class="zmark"><img src="assets/zorix-logo.svg" alt="Zorix logo"></span></button>
    <button class="menu-title" data-panel="about"><strong>Zorix</strong></button>
    <button class="menutext" data-panel="files">File</button>
    <button class="menutext" data-panel="launcher">View</button>
    <button class="menutext" data-panel="launcher">Go</button>
    <button class="menutext" data-panel="activity">Window</button>
    <button class="menutext" data-panel="support">Help</button>
  </div>
  <div class="menu-right">
    <div class="system-status-cluster" aria-label="System status">
      <button id="wifi-status" class="status-button" data-panel="control" aria-label="Network status"><span data-icon="wifi"></span><small>--</small></button>
      <button id="bluetooth-status" class="status-button" data-app="bluetooth" aria-label="Bluetooth"><span data-icon="bluetooth"></span></button>
      <button id="audio-status" class="status-button" data-app="audio" aria-label="Audio"><span data-icon="volume"></span></button>
      <button id="battery-status" class="status-button hidden-status" data-panel="control" aria-label="Battery status"><span data-icon="battery"></span><small>--</small></button>
    </div>
    <button id="spotlightButton" class="menu-icon" data-panel="launcher" aria-label="Search"><span data-icon="search"></span></button>
    <button class="menu-icon" data-panel="performance" aria-label="System activity"><span data-icon="pulse"></span></button>
    <button class="menu-icon" data-panel="control" aria-label="Control Center"><span data-icon="sliders"></span></button>
    <button id="clock" class="clock-button" data-panel="calendar">--:--</button>
  </div>
</header>

<main class="workspace">
  <section class="desktop-icons" aria-label="Desktop shortcuts">
    <button class="desktop-icon" data-panel="files"><span class="desktop-glyph blue" data-icon="folder"></span><strong>Home</strong></button>
    <button class="desktop-icon" data-app="browser"><span class="desktop-glyph cyan" data-icon="compass"></span><strong>Browser</strong></button>
    <button class="desktop-icon" data-panel="support"><span class="desktop-glyph gray" data-icon="shield"></span><strong>Support</strong></button>
  </section>

  <section class="desktop-home dashboard liquid-glass depth-card">
    <div class="specular"></div>
    <div class="home-header">
      <div>
        <span class="eyebrow"><span class="status-dot"></span> ZORIX OS 1.3.0</span>
        <h1>Good to see you.</h1>
        <p>A quieter desktop with liquid depth, fast access, and fewer things competing for attention.</p>
      </div>
      <span class="orbit-mark"><img src="assets/zorix-logo.svg" alt=""></span>
    </div>
    <div class="home-actions">
      <button class="home-action" data-panel="files"><span class="appicon blue" data-icon="folder"></span><span><strong>Files</strong><small>Home and documents</small></span></button>
      <button class="home-action" data-panel="tasks"><span class="appicon mint" data-icon="check"></span><span><strong>Flow</strong><small>Local task board</small></span></button>
      <button class="home-action" data-panel="notes"><span class="appicon amber" data-icon="note"></span><span><strong>Notes</strong><small>Capture an idea</small></span></button>
      <button class="home-action" data-panel="compatibility"><span class="appicon violet" data-icon="chip"></span><span><strong>Play</strong><small>Wine and GPU tools</small></span></button>
    </div>
    <div class="home-status">
      <div class="status-copy"><span id="health-text">Connecting to Zorix Core</span><small id="runtime">Swift-powered system information</small></div>
      <div class="compact-metrics"><span><b id="memory">--</b><small>memory</small></span><span><b id="cpu">--</b><small>processor</small></span></div>
      <div class="meter" aria-hidden="true"><i id="memory-bar"></i></div>
    </div>
  </section>

  <aside class="desktop-widgets">
    <section class="clockwidget liquid-glass depth-card">
      <div class="specular"></div>
      <span class="eyebrow" id="day">THURSDAY</span>
      <strong id="big-clock">--:--</strong>
      <span id="date">September 24</span>
      <div class="widget-divider"></div>
      <button class="widget-link" data-panel="calendar">Open Calendar <span data-icon="arrow"></span></button>
    </section>
    <button class="focuswidget liquid-glass depth-card" data-panel="focus">
      <span class="orb-icon" data-icon="moon"></span>
      <div><span class="eyebrow">FOCUS</span><strong id="focus-mini">Find your rhythm</strong><small>A quiet 25-minute timer</small></div>
      <span data-icon="arrow"></span>
    </button>
    <section class="mini-stack liquid-glass depth-card">
      <button data-panel="performance"><span data-icon="pulse"></span><div><strong>Activity</strong><small>Processes & hardware</small></div><span data-icon="arrow"></span></button>
      <button data-panel="glasslab"><span data-icon="droplet"></span><div><strong>Glass</strong><small>Material & motion</small></div><span data-icon="arrow"></span></button>
    </section>
  </aside>
</main>

<footer class="desktop-footer">
  <div class="dock liquid-glass" id="dock">
    <div class="dock-highlight" aria-hidden="true"></div>
    <button class="dock-zorix" data-panel="launcher" aria-label="Applications"><span class="appicon zorix-appicon"><img src="assets/zorix-logo.svg" alt=""></span><small>Apps</small></button>
    <i class="dock-divider"></i>
    <button data-panel="files" aria-label="Files"><span class="appicon blue" data-icon="folder"></span><small>Files</small></button>
    <button data-app="browser" aria-label="Browser"><span class="appicon cyan" data-icon="compass"></span><small>Browser</small></button>
    <button data-panel="notes" aria-label="Notes"><span class="appicon amber" data-icon="note"></span><small>Notes</small></button>
    <button data-panel="tasks" aria-label="Flow Board"><span class="appicon mint" data-icon="check"></span><small>Flow</small></button>
    <button data-app="terminal" aria-label="Terminal"><span class="appicon dark" data-icon="terminal"></span><small>Terminal</small></button>
    <span id="dock-dynamic" class="dock-dynamic"></span>
    <i class="dock-divider"></i>
    <button data-panel="compatibility" aria-label="Windows and GPU"><span class="appicon violet" data-icon="chip"></span><small>Play</small></button>
    <button data-app="ai" aria-label="AI"><span class="appicon rose" data-icon="sparkle"></span><small>AI</small></button>
    <button data-panel="settings" aria-label="Settings"><span class="appicon gray" data-icon="settings"></span><small>Settings</small></button>
  </div>
</footer>

<div class="overlay hidden" id="overlay">
  <section class="window liquid-glass" id="window" role="dialog" aria-modal="true" aria-labelledby="window-title">
    <div class="window-sheen"></div>
    <header class="titlebar" id="window-drag-handle">
      <div class="window-controls"><button class="close-dot" id="close" aria-label="Close"></button><span class="min-dot"></span><span class="zoom-dot"></span></div>
      <h2 id="window-title"></h2>
      <span class="window-label">ZORIX</span>
    </header>
    <div id="window-content"></div>
  </section>
</div>
<div id="toast" class="toast liquid-glass hidden" role="status"></div>
<script src="app.js"></script>
</body>
</html>
