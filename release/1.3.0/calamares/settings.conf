modules-search: [ local ]
instances:
- id: preuser
  module: shellprocess
  config: preuser.conf
  weight: 1
- id: postinstall
  module: shellprocess
  config: postinstall.conf
  weight: 1
sequence:
- show: [ welcome, locale, keyboard, partition, users, summary ]
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - shellprocess@preuser
  - locale
  - keyboard
  - localecfg
  - fstab
  - initramfs
  - users
  - displaymanager
  - services-systemd
  - shellprocess@postinstall
  - bootloader
  - umount
- show: [ finished ]
branding: zorix
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
