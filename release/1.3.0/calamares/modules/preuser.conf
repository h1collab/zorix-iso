dontChroot: false
timeout: 30
verbose: true
script:
  - "-userdel -r zorix"
  - "-rm -f /etc/sudoers.d/zorix-live-installer"
  - "-rm -f /etc/lightdm/lightdm.conf.d/20-zorix-live.conf"
  - "-rm -f /etc/systemd/system/zorix-live.service"
  - "mkdir -p /boot/efi /var/log/zorix"
  - "chmod 755 /usr/bin/zorix-session-supervisor"
i18n:
  name: "Preparing installed Zorix system"
